spring:
  application:
    name: seller-hub-api
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
app:
  analysis:
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 8
      thread-name-prefix: question-group-analysis-
