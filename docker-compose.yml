services:
  backend:
    build:
      context: ./backend
    container_name: sellerhub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: sellerhub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
